# Advances the build number on every push to main, so two installs of the same base
# version can never be confused: the App shows 1.4.0b7, 1.4.0b8, …
#
# It writes only `app/pubspec.yaml`, and the commit it makes uses GITHUB_TOKEN, which
# does not start new workflow runs (GitHub's recursion guard) — so this cannot loop.
# The build that follows a human push therefore still uses the previous number; the
# next push picks up the new one. That off-by-one is deliberate: bumping from inside
# the build job would mean every failed build burned a number.
name: Version bump

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'runtime/**'
      - 'tooling/**'
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(version):') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: true
      - name: Advance the build number
        run: python3 tooling/version/bump.py
      - name: Commit
        run: |
          set -euo pipefail
          version=$(python3 tooling/version/bump.py --check)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app/pubspec.yaml
          if git diff --cached --quiet; then
            echo "no version change"
            exit 0
          fi
          git commit -m "chore(version): $version"
          git push