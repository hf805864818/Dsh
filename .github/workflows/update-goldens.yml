# Regenerates the golden PNGs after a deliberate UI change and commits them back.
#
# Goldens are pixel comparisons: adding a section to a page fails them by design,
# and the correct fix is new reference images, not a wider tolerance. This runs
# only on demand, writes only under app/test/**/goldens, and refuses to commit
# anything else.
name: Update goldens

on:
  workflow_dispatch:
    inputs:
      paths:
        description: Space separated test files to regenerate (default=all goldens)
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: update-goldens-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.7
  TZ: Asia/Shanghai
  # The golden harness reads this; CI sets it at job level for the same reason.
  DSH_TEST_FONT_DIR: /usr/share/fonts/opentype/noto

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # The golden harness needs the same CJK + emoji fonts CI installs; without
      # NotoSansCJK-Light.ttc it refuses to load the test at all.
      - name: Install the test fonts
        env:
          DSH_TEST_FONT_DIR: /usr/share/fonts/opentype/noto
          NOTO_CJK_VERSION: 1:20230817+repack1-3
          NOTO_EMOJI_VERSION: v2.051
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          sudo apt-get update -q
          apt-get download fonts-noto-cjk="$NOTO_CJK_VERSION" fonts-noto-cjk-extra="$NOTO_CJK_VERSION"
          for deb in fonts-noto-cjk*.deb; do dpkg-deb -x "$deb" unpacked; done
          mkdir -p ~/test-fonts
          cp unpacked/usr/share/fonts/opentype/noto/NotoSansCJK-{Regular,Bold,Light}.ttc ~/test-fonts/
          curl -fsSL --retry 3 -o ~/test-fonts/NotoColorEmoji.ttf "https://raw.githubusercontent.com/googlefonts/noto-emoji/$NOTO_EMOJI_VERSION/fonts/NotoColorEmoji.ttf"
          sudo install -Dm644 -t "$DSH_TEST_FONT_DIR" ~/test-fonts/NotoSansCJK-*.ttc
          sudo install -Dm644 ~/test-fonts/NotoColorEmoji.ttf /usr/share/fonts/noto/NotoColorEmoji.ttf
      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: Regenerate goldens
        working-directory: app
        run: |
          set -euo pipefail
          files="${{ inputs.paths }}"
          if [ -z "$files" ]; then
            files=$(find test -name '*golden*_test.dart' | tr '\n' ' ')
          fi
          echo "regenerating: $files"
          flutter test --update-goldens $files
      - name: Commit only goldens
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- app/test
          if git diff --cached --quiet; then
            echo "no golden changed"
            exit 0
          fi
          outside=$(git diff --cached --name-only | grep -v -E '^app/test/.*/goldens/' || true)
          if [ -n "$outside" ]; then
            echo "refusing to commit files outside goldens:" >&2
            echo "$outside" >&2
            exit 1
          fi
          git commit -m "test(goldens): regenerate after the UI change"
          git push
