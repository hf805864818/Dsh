# Regenerates the golden PNGs after a deliberate UI change and commits them back.
#
# Goldens are pixel comparisons: adding a section to a page fails them by design,
# and the correct fix is new reference images, not a wider tolerance. This runs
# only on demand, writes only under app/test/**/goldens, and refuses to commit
# anything else.
name: Update goldens

on:
  workflow_dispatch:
    inputs:
      paths:
        description: Space separated test files to regenerate (default=all goldens)
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: update-goldens-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.7
  TZ: Asia/Shanghai

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: Regenerate goldens
        working-directory: app
        run: |
          set -euo pipefail
          files="${{ inputs.paths }}"
          if [ -z "$files" ]; then
            files=$(find test -name '*golden*_test.dart' | tr '\n' ' ')
          fi
          echo "regenerating: $files"
          flutter test --update-goldens $files
      - name: Commit only goldens
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- 'app/test/**/goldens'
          if git diff --cached --quiet; then
            echo "no golden changed"
            exit 0
          fi
          git commit -m "test(goldens): regenerate after the UI change"
          git push
